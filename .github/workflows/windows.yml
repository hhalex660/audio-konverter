# Baut die Windows-.exe auf GitHub. Starten: Actions -> "Windows-Build" -> Run workflow.
# Bei einem Tag (z. B. v0.4.0) entsteht zusätzlich ein Release mit der .exe.
name: Windows-Build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Release-Version prüfen (nur bei Tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        run: python scripts/check-release-version.py Cargo.toml "$env:TAG"
        env:
          TAG: ${{ github.ref_name }}
      - run: python -m unittest discover -s tests -p test_release_version.py
      - run: cargo test --release
      - run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: audio-konverter-windows
          path: target/release/audio-konverter.exe
      - if: startsWith(github.ref, 'refs/tags/v')
        run: gh release create "${{ github.ref_name }}" target/release/audio-konverter.exe --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

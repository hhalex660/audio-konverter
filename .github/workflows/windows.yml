name: Build and release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libx11-dev libxi-dev libgl1-mesa-dev libxcursor-dev libxrandr-dev libxinerama-dev libxkbcommon-dev libwayland-dev
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          version: 2026.11.3
          cache: false
      - name: Format and lint
        run: mise run check
      - name: Install cargo-deny
        run: mise exec -- cargo install cargo-deny --version 0.22.0 --locked
      - name: Check dependencies
        run: mise exec -- cargo deny --locked check
      - run: python3 -m unittest discover -s tests -p test_release_version.py
      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: python3 scripts/check-release-version.py Cargo.toml "$TAG"

  windows:
    needs: validate
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          version: 2026.11.3
          cache: false
      - run: mise run test
      - run: mise run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: audio-konverter-windows-x86_64
          path: target/release/audio-konverter.exe
          if-no-files-found: error

  linux:
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libx11-dev libxi-dev libgl1-mesa-dev libxcursor-dev libxrandr-dev libxinerama-dev libxkbcommon-dev libwayland-dev
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          version: 2026.11.3
          cache: false
      - run: mise run test
      - run: mise run build
      - name: Build Debian package
        run: |
          mise exec -- cargo install cargo-packager --version 0.11.8 --locked
          mise exec -- cargo packager --release --formats deb
      - name: Build tar archive
        run: |
          mkdir -p dist
          tar -czf dist/audio-konverter-linux-x86_64.tar.gz -C target/release audio-konverter -C "$GITHUB_WORKSPACE" LICENSE
          cp target/release/*.deb dist/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: audio-konverter-linux-x86_64
          path: dist/*
          if-no-files-found: error

  macos:
    needs: validate
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          version: 2026.11.3
          cache: false
      - run: mise exec -- rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - run: mise run test
      - name: Build universal binary and packages
        run: |
          mise exec -- cargo build --release --locked --target aarch64-apple-darwin
          mise exec -- cargo build --release --locked --target x86_64-apple-darwin
          mkdir -p target/universal-apple-darwin/release
          lipo -create target/aarch64-apple-darwin/release/audio-konverter target/x86_64-apple-darwin/release/audio-konverter -output target/universal-apple-darwin/release/audio-konverter
          lipo -verify_arch arm64 x86_64 target/universal-apple-darwin/release/audio-konverter
          codesign --force --sign - target/universal-apple-darwin/release/audio-konverter
          codesign --verify target/universal-apple-darwin/release/audio-konverter
          mise exec -- cargo install cargo-packager --version 0.11.8 --locked
          mise exec -- cargo packager --release --target universal-apple-darwin --formats app,dmg
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: audio-konverter-macos-universal
          path: target/universal-apple-darwin/release/*.dmg
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/* --verify-tag --generate-notes --draft
          gh release edit "$TAG" --draft=false

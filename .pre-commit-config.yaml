# Prüfungen vor jedem Commit (laufen mit `prek`, siehe wiki/pruefungen.md).
# Einmal einrichten: `prek install`. Alle Dateien prüfen: `prek run --all-files`.
default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: local
    hooks:
      - id: rustfmt
        name: rustfmt (Format)
        entry: cargo fmt --all -- --check
        language: system
        files: '(^|/)(Cargo\.toml|Cargo\.lock)$|\.rs$'
        pass_filenames: false
      - id: clippy
        name: clippy (Lints, Warnungen sind Fehler)
        entry: cargo clippy --all-targets --locked -- -D warnings
        language: system
        files: '(^|/)(Cargo\.toml|Cargo\.lock)$|\.rs$'
        pass_filenames: false

  - repo: https://github.com/crate-ci/committed
    rev: v1.1.12
    hooks:
      - id: committed

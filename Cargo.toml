[package]
name = "audio-konverter"
version = "0.4.4"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["Alexander Singh"]

[package.metadata.packager]
product-name = "Audio Konverter"
identifier = "dev.alexandersingh.audio-konverter"
description = "Convert folders of audio files"

[package.metadata.packager.deb]
depends = ["libc6 (>= 2.39)", "libgcc-s1", "libx11-6", "libxcursor1", "libxi6", "libxrandr2", "libxkbcommon0", "libwayland-client0", "libgl1", "xdg-desktop-portal"]

[dependencies]
eframe = "0.29"                                              # GUI (egui)
egui_extras = { version = "0.29", features = ["svg"] }       # SVG-Icons (Lucide)
rfd = "0.18"                                                 # nativer Ordner- und Speichern-Dialog
walkdir = "2.5"                                              # Unterordner durchsuchen
symphonia = { version = "0.5", default-features = false, features = ["flac", "wav", "aiff", "pcm"] } # Dateien lesen
rubato = "0.16"                                              # Sample-Rate umrechnen
mp3lame-encoder = "0.3"                                      # MP3 schreiben (LAME eingebaut, braucht beim Bauen einen C-Compiler)
id3 = "1.17"                                                 # Tags und Cover (ID3v2)
flacenc = { version = "0.5.1", default-features = false }   # FLAC schreiben (reines Rust)

[dev-dependencies]
tempfile = "3"
symphonia = { version = "0.5", default-features = false, features = ["mp3"] }

# Auch im Debug-Build sind die Bibliotheken optimiert. Für echte Umwandlungen
# trotzdem `cargo run --release` verwenden (siehe wiki/bekannte-probleme.md).
[profile.dev.package."*"]
opt-level = 3

# Lint-Regeln: clippy mit den Gruppen „all“ und „pedantic“ als Warnung (im Pre-Commit und in der CI
# mit -D warnings als Fehler). Ausnahmen stehen hier mit Begründung, nicht im Code verstreut.
[lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn" # jedes `unsafe` braucht einen SAFETY-Kommentar
dbg_macro = "warn"
todo = "warn"
# Audio-Rechnen wandelt ständig zwischen Ganzzahlen und Fließkomma (Samples, Frames, Raten).
# Die Werte sind durch die Formate begrenzt, die Warnungen wären überall dasselbe Rauschen.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"

# Fertige Datei: voll optimiert, klein. Kein panic = "abort", die Umwandlung fängt Abstürze ab.
[profile.release]
lto = true
codegen-units = 1
strip = true
